<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My DevOps Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 20px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #00c6ff;
            color: black;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #00aaff;
        }

        .card {
            margin: 30px auto;
            padding: 20px;
            width: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Hello, I'm Vishnu</h1>
    <p>DevOps Learner | CI/CD Engineer</p>

    <button class="btn">View My Projects</button>

    <div class="card">
        <h3>🔥 My Skills</h3>
        <p>Git | GitHub Actions | Linux | AWS</p>
    </div>

    <div class="card">
        <h3>⚙️ Project</h3>
        <p>CI/CD Pipeline using GitHub Actions</p>
    </div>
</div>

</body>
</html>
